spring:
  application:
    name: tresor-api

  # Database configuration (H2 for development, PostgreSQL for production)
  datasource:
    url: jdbc:h2:mem:tresordb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA/Hibernate configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Flyway (disabled for MVP - using Hibernate DDL)
  flyway:
    enabled: false

  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Jackson JSON configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Server configuration
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

# Logging configuration
logging:
  level:
    root: INFO
    io.tresor: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Tresor application configuration
tresor:
  # Encryption settings
  encryption:
    algorithm: AES-256-GCM
    key-size: 256
    iv-size: 12

  # Secret sharing settings
  secret-sharing:
    total-shares: 5
    threshold: 3
    scheme: shamir

  # Deployment tiers (cost optimization)
  deployment-tiers:
    budget:
      name: "Budget"
      cost-usd: 0.57
      description: "24-hour batch deployment to cheap L2s"
      blockchains:
        - POLYGON      # $0.01
        - BASE         # $0.01
        - OPTIMISM     # $0.05
      batch-deployment: true
      batch-delay-hours: 24
      instant-deployment: false
      recommended: true

    standard:
      name: "Standard"
      cost-usd: 3.00
      description: "Instant deployment to fast L2s"
      blockchains:
        - ARBITRUM     # $0.50
        - POLYGON      # $0.01
        - AVALANCHE    # $0.50
      batch-deployment: false
      instant-deployment: true
      recommended: false

    premium:
      name: "Premium"
      cost-usd: 13.00
      description: "Maximum security with Bitcoin + Ethereum"
      blockchains:
        - BITCOIN      # $7.00
        - ETHEREUM     # $5.00
        - ARBITRUM     # $0.50
      batch-deployment: false
      instant-deployment: true
      max-security: true
      recommended: false

    enterprise:
      name: "Enterprise"
      cost-usd: 25.00
      description: "Maximum redundancy with SLA guarantee"
      total-shares: 7
      threshold: 5
      blockchains:
        - BITCOIN      # $7.00
        - ETHEREUM     # $5.00
        - ARBITRUM     # $0.50
        - POLYGON      # $0.01
        - BASE         # $0.01
        - OPTIMISM     # $0.05
        - AVALANCHE    # $0.50
      batch-deployment: false
      instant-deployment: true
      sla-guarantee: true
      recommended: false

  # Blockchain deployment settings (legacy - use tiers above)
  blockchain:
    default-tier: budget  # Use budget tier by default
    enable-self-custody: true
    enable-arweave: false

  # Unlock scheduler settings
  scheduler:
    unlock-check-interval: PT10M  # Every 10 minutes
    retry-max-attempts: 10
    retry-max-age-days: 7

  # Batch deployment settings
  batch:
    enabled: true
    schedule-cron: "0 0 0 * * *"  # Daily at midnight
    min-messages-for-batch: 1      # Batch even single messages for consistency
    max-wait-hours: 24             # Deploy within 24 hours regardless

  # Email settings (placeholder for production)
  email:
    enabled: false
    from: noreply@tresor.app

---
# Production profile
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tresor}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:tresor}
    password: ${DATABASE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

server:
  error:
    include-stacktrace: never

logging:
  level:
    root: WARN
    io.tresor: INFO
    org.hibernate.SQL: WARN
